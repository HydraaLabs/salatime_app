name: iOS private device test

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-private-device-test
  cancel-in-progress: false

jobs:
  resign:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_GOOGLE_REVERSED_CLIENT_ID: ${{ vars.IOS_GOOGLE_REVERSED_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare temporary paths
        run: |
          printf '%s\n' "PYTHONPATH=$RUNNER_TEMP/adhoc-python" >> "$GITHUB_ENV"
          printf '%s\n' "SOURCE_RUN_METADATA=$RUNNER_TEMP/source-release-run.json" >> "$GITHUB_ENV"
          printf '%s\n' "SOURCE_ARTIFACT_DIRECTORY=$RUNNER_TEMP/source-app-store" >> "$GITHUB_ENV"
          printf '%s\n' "ENCRYPTED_ARTIFACT_DIRECTORY=$RUNNER_TEMP/encrypted-device-artifact" >> "$GITHUB_ENV"
      - name: Select Xcode and verify authorized source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35169632691" > "$SOURCE_RUN_METADATA"
          python3 -m pip install --quiet --target "$RUNNER_TEMP/adhoc-python" "cryptography>=44,<49"
          python3 tool/ios_adhoc.py self-test
      - uses: actions/download-artifact@v4
        with:
          name: SalaTime-iOS-28
          path: ${{ env.SOURCE_ARTIFACT_DIRECTORY }}
          run-id: 35169632691
          github-token: ${{ github.token }}
      - name: Re-sign for the registered device and encrypt IPA
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_ADHOC_APP_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_APP_PROFILE_BASE64 }}
          IOS_ADHOC_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_WIDGET_PROFILE_BASE64 }}
          IOS_ADHOC_ARTIFACT_PASSWORD: ${{ secrets.IOS_ADHOC_ARTIFACT_PASSWORD }}
        run: python3 tool/ios_adhoc.py resign
      - name: Save encrypted device package
        uses: actions/upload-artifact@v4
        with:
          name: SalaTime-iOS-AdHoc-28-encrypted
          path: |
            ${{ env.ENCRYPTED_ARTIFACT_DIRECTORY }}/SalaTime-AdHoc-28.ipa.enc
            ${{ env.ENCRYPTED_ARTIFACT_DIRECTORY }}/validation.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove all private signing material
        if: always()
        run: |
          python3 tool/ios_adhoc.py cleanup
          rm -rf "$SOURCE_ARTIFACT_DIRECTORY" "$ENCRYPTED_ARTIFACT_DIRECTORY"
          rm -f "$SOURCE_RUN_METADATA"
          rm -rf "$RUNNER_TEMP/adhoc-python"
