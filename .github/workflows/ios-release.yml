name: iOS App Store release

on:
  workflow_dispatch:
    inputs:
      version:
        description: App Store version matching pubspec.yaml
        required: true
        default: '1.0.30'
        type: string
      previous_version:
        description: Previous public App Store version used to preserve metadata
        required: true
        default: '1.0.29'
        type: string
      build_number:
        description: Unique CFBundleVersion for this upload
        required: true
        default: '40'
        type: string
      upload_to_testflight:
        description: Upload the validated IPA to App Store Connect
        required: true
        default: false
        type: boolean
      submit_to_app_store:
        description: Submit this release to App Review after the exact uploaded build is valid
        required: true
        default: false
        type: boolean
      resume_submission:
        description: Resume App Review submission of the existing build without building or uploading again
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-app-store-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && !inputs.resume_submission
    runs-on: macos-15
    timeout-minutes: 75
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_GOOGLE_REVERSED_CLIENT_ID: ${{ vars.IOS_GOOGLE_REVERSED_CLIENT_ID }}
      STORE_VERSION: ${{ inputs.version }}
      PREVIOUS_STORE_VERSION: ${{ inputs.previous_version }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
      UPLOAD_TO_TESTFLIGHT: ${{ inputs.upload_to_testflight }}
      SUBMIT_TO_APP_STORE: ${{ inputs.submit_to_app_store }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26.3 and check release configuration
        run: |
          test -d /Applications/Xcode_26.3.app
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          if [ "$SUBMIT_TO_APP_STORE" = "true" ] && [ "$UPLOAD_TO_TESTFLIGHT" != "true" ]; then
            printf '%s\n' 'App Store submission requires upload_to_testflight=true.' >&2
            exit 1
          fi
          if [ "$UPLOAD_TO_TESTFLIGHT" = "true" ]; then
            python3 tool/ios_release.py preflight --require-apple
          else
            python3 tool/ios_release.py preflight
          fi
          python3 tool/ios_release.py self-test
          python3 tool/ios_store_submission.py --self-test
          ruby -e 'require "xcodeproj"; puts "xcodeproj #{Xcodeproj::VERSION}"'
      - name: Check App Store version and unused build number
        if: inputs.upload_to_testflight
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 tool/ios_store_submission.py --preflight --for-upload \
            --version="$STORE_VERSION" --previous-version="$PREVIOUS_STORE_VERSION" --build-number="$RELEASE_BUILD_NUMBER" \
            --receipt=build/ios/app-store-preflight.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - name: Resolve dependencies and verify shared code
        run: |
          flutter pub get
          flutter analyze
          flutter test --dart-define=SALATIME_APPLE_IOS_ENABLED=true \
            --dart-define=SALATIME_SENTRY_ENABLED=false \
            --dart-define=SALATIME_SENTRY_ENVIRONMENT=ci \
            --dart-define=SALATIME_GOOGLE_IOS_ENABLED="$GOOGLE_IOS_ENABLED"
      - name: Build simulator and run native iOS regression tests
        run: |
          flutter build ios --simulator --debug --no-codesign \
            --dart-define=SALATIME_SENTRY_ENABLED=false \
            --dart-define=SALATIME_SENTRY_ENVIRONMENT=ci \
            --dart-define=SALATIME_APPLE_IOS_ENABLED=true \
            --dart-define=SALATIME_GOOGLE_IOS_ENABLED="$GOOGLE_IOS_ENABLED"
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild -quiet -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO BUILD_DIR="$PWD/build/ios" \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO -only-testing:RunnerTests test
      - name: Prepare App Store signing
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          python3 tool/ios_release.py prepare
          ruby tool/ios_release_signing.rb "$RUNNER_TEMP/salatime-ios-signing/state.json"
      - name: Build signed App Store archive and IPA
        run: |
          flutter build ipa --release \
            --dart-define=SALATIME_SENTRY_ENABLED=true \
            --dart-define=SALATIME_SENTRY_ENVIRONMENT=production \
            --build-number="$RELEASE_BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/salatime-ios-signing/ExportOptions.plist" \
            --dart-define=SALATIME_APPLE_IOS_ENABLED=true \
            --dart-define=SALATIME_GOOGLE_IOS_ENABLED="$GOOGLE_IOS_ENABLED"
      - name: Verify signed archive, IPA and WidgetKit extension
        run: python3 tool/ios_release.py verify
      - name: Save validated distribution files
        uses: actions/upload-artifact@v4
        with:
          name: SalaTime-iOS-${{ inputs.build_number }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/release-validation.json
            build/ios/provider-configuration.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload validated build to App Store Connect
        if: inputs.upload_to_testflight
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/salatime-ios-signing/private_keys
        run: |
          python3 tool/ios_release.py preflight --require-apple
          python3 tool/ios_release.py api-key
          shopt -s nullglob
          packages=(build/ios/ipa/*.ipa)
          test "${#packages[@]}" -eq 1
          xcrun altool --validate-app --type ios --file "${packages[0]}" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "${packages[0]}" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          printf '%s\n' 'Upload accepted. Apple processing and TestFlight availability must be checked in App Store Connect.' >> "$GITHUB_STEP_SUMMARY"
      - name: Submit exact processed account-language update to App Review
        if: inputs.submit_to_app_store
        timeout-minutes: 25
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 tool/ios_store_submission.py --submit \
            --version="$STORE_VERSION" --previous-version="$PREVIOUS_STORE_VERSION" --build-number="$RELEASE_BUILD_NUMBER" \
            --receipt=build/ios/app-store-submission.json
      - name: Save sanitized App Store state and submission receipt
        if: always() && inputs.upload_to_testflight
        uses: actions/upload-artifact@v4
        with:
          name: SalaTime-App-Store-receipt-${{ inputs.build_number }}
          path: |
            build/ios/app-store-preflight.json
            build/ios/app-store-submission.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove signing material
        if: always()
        run: python3 tool/ios_release.py cleanup
  submit-existing:
    if: github.event_name == 'workflow_dispatch' && inputs.resume_submission
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STORE_VERSION: ${{ inputs.version }}
      PREVIOUS_STORE_VERSION: ${{ inputs.previous_version }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
      SUBMIT_TO_APP_STORE: ${{ inputs.submit_to_app_store }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require explicit App Store submission for resume mode
        run: |
          if [ "$SUBMIT_TO_APP_STORE" != "true" ]; then
            printf '%s\n' 'resume_submission requires submit_to_app_store=true.' >&2
            exit 1
          fi
      - name: Read existing App Store version and exact build
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 tool/ios_store_submission.py --preflight \
            --version="$STORE_VERSION" --previous-version="$PREVIOUS_STORE_VERSION" --build-number="$RELEASE_BUILD_NUMBER" \
            --receipt=build/ios/app-store-preflight.json
      - name: Resume exact processed account-language update submission
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 tool/ios_store_submission.py --submit \
            --version="$STORE_VERSION" --previous-version="$PREVIOUS_STORE_VERSION" --build-number="$RELEASE_BUILD_NUMBER" \
            --receipt=build/ios/app-store-submission.json
      - name: Save sanitized resumed submission receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SalaTime-App-Store-receipt-${{ inputs.build_number }}
          path: |
            build/ios/app-store-preflight.json
            build/ios/app-store-submission.json
          if-no-files-found: ignore
          retention-days: 7
