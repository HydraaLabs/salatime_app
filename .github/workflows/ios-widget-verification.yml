name: iOS widget verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  widget:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Type-check WidgetKit views and shared prayer data
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcrun --sdk iphonesimulator swiftc -typecheck -parse-as-library \
            -swift-version 5 -module-name SalaTimeWidget \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -target arm64-apple-ios16.0-simulator \
            ios/Shared/PrayerWidgetData.swift \
            ios/SalaTimeWidget/SalaTimeWidget.swift
      - name: Check delivered prayer history selection
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library \
            ios/Runner/PrayerNotificationHistory.swift \
            tool/prayer_notification_history_check.swift \
            -o "$RUNNER_TEMP/prayer-history-check"
          "$RUNNER_TEMP/prayer-history-check"
          xcrun --sdk iphonesimulator swiftc -typecheck -parse-as-library \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -target arm64-apple-ios16.0-simulator \
            ios/Runner/PrayerNotificationHistory.swift
