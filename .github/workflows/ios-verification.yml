name: iOS verification
on:
  workflow_dispatch:
  push:
    branches: [ios-compatibility]
permissions:
  contents: read
concurrency:
  group: ios-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Build iOS simulator app and WidgetKit extension
        run: flutter build ios --simulator --debug --no-codesign --dart-define=SALATIME_SENTRY_DSN=
      - name: Package simulator build
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/SalaTime-simulator.zip
      - name: Analyze and test shared code
        run: |
          flutter analyze
          flutter test
      - name: Build unsigned iPhone release
        run: flutter build ios --release --no-codesign --dart-define=SALATIME_SENTRY_DSN=
      - name: Run iOS native regression tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild -quiet -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO BUILD_DIR="$PWD/build/ios" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO DART_DEFINES=U0FMQVRJTUVfU0VOVFJZX0RTTj0= -only-testing:RunnerTests test
      - name: Capture iOS launch
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$SIMULATOR_ID" net.salatime.app
          sleep 8
          xcrun simctl io "$SIMULATOR_ID" screenshot build/ios-launch.png
      - name: Save simulator build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SalaTime-iOS-simulator
          path: |
            build/SalaTime-simulator.zip
            build/ios-launch.png
          retention-days: 7
