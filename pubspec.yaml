name: zabi
description: A new Flutter project.
publish_to: "none"
version: 1.0.15+18

environment:
  sdk: ">=3.9.0 <4.0.0"

#==== Dependencies start ====#
dependencies:
  sentry_flutter: ^9.29.0
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  shared_preferences: ^2.2.2
  geolocator: ^13.0.1
  geocoding: ^4.0.0
  intl: ^0.20.2
  http: ^1.1.0
  path: ^1.8.3
  http_parser: ^4.0.2
  hijri: ^3.0.0
  vibration: ^3.1.3
  url_launcher: ^6.1.10
  flutter_launcher_icons: ^0.14.4
  flutter_svg: ^2.0.9
  #  google_fonts: ^8.0.1
  sqflite: ^2.3.0
  flutter_timezone: ^4.1.0
  #  prayers_times: ^0.0.6
  share_plus: ^11.1.0
  permission_handler: ^12.0.1
  # Native alarm recovery adapter targets this version's persisted format.
  flutter_local_notifications: 17.2.4
  timezone: ^0.9.3
  flutter_qiblah: ^3.1.0+1
  shimmer: ^3.0.0
  scrollable_positioned_list: ^0.3.8
  just_audio: ^0.10.5
  audio_service: ^0.18.15
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  wallpaper_setter: ^1.0.0
  path_provider: ^2.1.3
  flutter_tts: ^4.2.3
  connectivity_plus: ^7.0.0
  google_fonts: ^8.2.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_compass_v2: ^1.0.3
  package_info_plus: ^9.0.1
  adhan: ^2.0.0+1

  # just_audio: ^0.9.38
  # path_provider: ^2.1.3

dependency_overrides:
  flutter_compass_v2:
    path: packages/flutter_compass_v2

#==== Dev Dependencies start ====#
dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  #==== Assets start ====#
  assets:
    - assets/icon/
    - assets/icon/flag/
    - assets/icon/modern-icons/svg/
    - assets/language/
    - assets/audio/
    - assets/quran/
    - assets/quran/en/
    - assets/quran/bn/
    - assets/quran/sp/
    - assets/quran/ar/
    - shorebird.yaml

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto-Black.ttf
          weight: 900

    - family: Scheherazade New
      fonts:
        - asset: assets/font/ScheherazadeNew-Regular.ttf
          weight: 400

    - family: Amiri
      fonts:
        - asset: assets/font/Amiri-Regular.ttf
          weight: 400

    - family: AmiriQuran
      fonts:
        - asset: assets/font/AmiriQuran-Regular.ttf
          weight: 400

    - family: Lateef
      fonts:
        - asset: assets/font/Lateef-Regular.ttf
          weight: 400

    - family: NotoKufiArabic
      fonts:
        - asset: assets/font/NotoKufiArabic-Regular.ttf
          weight: 400

    - family: NotoNaskhArabic
      fonts:
        - asset: assets/font/NotoNaskhArabic-Regular.ttf
          weight: 400

    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/font/NotoNastaliqUrdu-Regular.ttf
          weight: 400

    - family: NotoSansArabic
      fonts:
        - asset: assets/font/NotoSansArabic-Regular.ttf
          weight: 400

    - family: ReadexPro
      fonts:
        - asset: assets/font/ReadexPro-Regular.ttf
          weight: 400

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  name: net.salatime.app
  project: salamtime
  org: hydra-x6
